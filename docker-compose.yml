# Local stack. The web app works without any of these services; the API adds shared experiment
# storage, the Python reference engine and the WebSocket stream.
#
#   docker compose up --build                 # web + api + postgres + minio
#   docker compose --profile cache up         # also Redis
#   docker compose --profile analytics up     # also ClickHouse
#   docker compose --profile observability up # also an OpenTelemetry collector + Prometheus + Grafana
name: echospace

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: echospace
      POSTGRES_PASSWORD: echospace
      POSTGRES_DB: echospace
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U echospace"]
      interval: 5s
      retries: 10

  minio:
    image: minio/minio:RELEASE.2024-10-13T13-34-11Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: echospace
      MINIO_ROOT_PASSWORD: echospace-secret
    ports: ["9000:9000", "9001:9001"]
    volumes: [minio:/data]

  minio-init:
    image: minio/mc:RELEASE.2024-10-08T09-37-26Z
    depends_on: [minio]
    entrypoint: >
      /bin/sh -c "until mc alias set local http://minio:9000 echospace echospace-secret; do sleep 1; done;
      mc mb -p local/echospace-artifacts; exit 0"

  api:
    build:
      context: .
      dockerfile: services/api/Dockerfile
    env_file: .env.example
    environment:
      DATABASE_URL: postgresql+psycopg://echospace:echospace@postgres:5432/echospace
      OBJECT_STORE: s3
      S3_ENDPOINT: http://minio:9000
      S3_BUCKET: echospace-artifacts
      AWS_ACCESS_KEY_ID: echospace
      AWS_SECRET_ACCESS_KEY: echospace-secret
      CORS_ORIGINS: http://localhost:3000
    depends_on:
      postgres: { condition: service_healthy }
      minio-init: { condition: service_completed_successfully }
    ports: ["8000:8000"]

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    depends_on: [api]
    ports: ["3000:3000"]

  redis:
    image: redis:7-alpine
    profiles: [cache]
    ports: ["6379:6379"]

  clickhouse:
    image: clickhouse/clickhouse-server:24.8
    profiles: [analytics]
    ports: ["8123:8123"]

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.111.0
    profiles: [observability]
    command: ["--config=/etc/otel/config.yaml"]
    volumes: ["./infrastructure/otel/config.yaml:/etc/otel/config.yaml:ro"]
    ports: ["4317:4317", "4318:4318"]

  prometheus:
    image: prom/prometheus:v2.54.1
    profiles: [observability]
    volumes: ["./infrastructure/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro"]
    ports: ["9090:9090"]

  grafana:
    image: grafana/grafana:11.2.2
    profiles: [observability]
    ports: ["3001:3000"]

volumes:
  pgdata:
  minio:
