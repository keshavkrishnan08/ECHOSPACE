[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "echospace"
version = "0.1.0"
description = "ECHOSPACE Python reference implementation: synthetic CSI simulator and inference pipeline"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "pydantic>=2",
]

[project.optional-dependencies]
api = [
    "fastapi>=0.115",
    "uvicorn[standard]",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "pydantic-settings>=2.4",
    "python-multipart>=0.0.9",
    "psycopg[binary]>=3.2",
    "boto3",
    "httpx",
    "websockets",
    "opentelemetry-api>=1.25",
    "opentelemetry-sdk>=1.25",
]
otlp = [
    "opentelemetry-exporter-otlp-proto-http>=1.25",
]
dev = [
    "pytest",
    "ruff",
    "mypy",
]

[tool.setuptools]
package-dir = { "echospace_sim" = "services/simulator/echospace_sim", "echospace_inference" = "services/inference/echospace_inference", "echospace_api" = "services/api/echospace_api", "echospace_telemetry" = "services/telemetry/echospace_telemetry" }
packages = [
    "echospace_sim",
    "echospace_inference",
    "echospace_api",
    "echospace_telemetry",
]

[tool.setuptools.package-data]
"echospace_sim" = ["presets/*.json", "py.typed"]
"echospace_inference" = ["py.typed"]
"echospace_api" = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["services/simulator/tests", "services/inference/tests", "services/api/tests"]
addopts = "-ra --import-mode=importlib"
filterwarnings = [
    # Starlette's TestClient warns that it will move from httpx to httpx2.
    "ignore:Using `httpx` with `starlette.testclient`",
]

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["node_modules", "packages", "apps"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "SIM", "RUF", "NPY"]
ignore = [
    "N803",  # argument names such as M, K, L mirror the TypeScript engine and the literature
    "N806",  # same for local variables
    "RUF001",  # strings and docstrings use mathematical symbols (σ, Φ, ×)
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.per-file-ignores]
# Definitions are copied verbatim from packages/schemas/src/metrics.ts.
"services/api/echospace_api/metrics_catalog.py" = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["echospace_sim", "echospace_inference", "echospace_api", "echospace_telemetry"]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
ignore_missing_imports = true
