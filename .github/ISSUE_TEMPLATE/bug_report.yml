name: Bug report
description: Something behaves differently from what the docs or UI say
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: Include the situation or scenario, seed and any console output.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: Environment
      placeholder: browser, OS, Node and Python versions
